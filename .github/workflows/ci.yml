name: CI Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]


jobs:
  ci:
    runs-on: ubuntu-latest

    steps:
    - name: starting ci pipeline message
      run: echo "Running CI pipeline for Python project"

    - name: Checkout code
      uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: "3.11"


    - name: Install dependencies
      run: |
        pip install -r requirements.txt
        pip install -e .

    - name: Format check 
      run: make format

    - name: Lint check 
      run: make lint

    - name: Run tests
      run: pytest tests/ -v