[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "house_price_prediction"
version = "0.0.0"
description = " house price prediction"

[tool.setuptools.packages. find]
where = ["."]

[tool.pytest.ini_options]
pythonpath = [".", "scripts"]
testpaths = ["tests"]
