[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.poetry]
name = "house_price_prediction"
version = "0.0.0"
description = "House price prediction pipeline"
requires-python = ">=3.11"

dependencies = [
  # ── Web scraping ────────────────────────────────────────────
  "requests>=2.31",
  "urllib3>=2.0",
  "beautifulsoup4>=4.12",
  # ── Data & numerics ─────────────────────────────────────────
  "numpy>=1.26",
  "pandas>=2.0",
  "scipy>=1.11",
  # ── Machine learning ────────────────────────────────────────
  "scikit-learn>=1.4",
  "xgboost>=2.0",
  "joblib>=1.3",
  # ── Experiment tracking ─────────────────────────────────────
  "mlflow>=2.12",
  # ── Visualisation ───────────────────────────────────────────
  "matplotlib>=3.8",
  "seaborn>=0.13",
  # ── Geospatial ──────────────────────────────────────────────
  "osmium>=3.7",
  # ── Validation ──────────────────────────────────────────────
  "pydantic>=2.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "pytest-cov>=5.0",
  "ruff>=0.4",
]


packages = [{ include = "src" }]

[tool.poetry.dependencies]
python = "^3.11"
joblib = "*"
matplotlib = "*"
mlflow = "*"
numpy = "*"
pandas = "*"
streamlit = "*"
scikit-learn = "*"
seaborn = "*"
xgboost = "*"
ruff = "*"
pytest = "*"
statsmodels = "^0.14.6"
pytest-cov = "*"


[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]  
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["src"]   

# TODO: add new script folders to include when you add stages
# e.g. include = ["scripts/", "src/"]


# ─── Coverage ─────────────────────────────────────────────────────────────────
[tool.coverage.run]
source = ["src"]
omit = [
    "tests/*",
    "**/__init__.py",
    "src/models/*",
    "src/visualization/*"
]

# TODO: add new source folders here as you add stages
# e.g. source = ["scripts", "src/training", "src/evaluation"]

[tool.coverage.report]
show_missing = true
skip_empty   = true


